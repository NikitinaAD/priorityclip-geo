name: Verify PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify
        required: true
        default: 0.1.1
        type: string

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --only-binary=:all: "priorityclip-geo==${{ inputs.version }}"
      - run: priorityclip --version
      - run: priorityclip --help
